services:
  db:
    image: mysql:8
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    ports:
      - "3306:3306"

  wordpress:
    depends_on:
      - db
      - mailpit
    build: .
    volumes:
      - ./wordpress_data:/var/www/html
    ports:
      - "8000:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_TABLE_PREFIX: wpxp_
      WORDPRESS_DEBUG: 1
      WORDPRESS_DEBUG_LOG: 1
      SMTP_HOST: mailpit
      SMTP_PORT: 1025

  mailpit:
    image: axllent/mailpit
    restart: always
    ports:
      - "8025:8025"

  wp-cli:
    image: wordpress:cli
    volumes:
      - ./wordpress_data:/var/www/html
    depends_on:
      - db
    entrypoint: ["sh", "-c", "while ! nc -z db 3306; do sleep 1; done; wp core is-installed"]

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data:
  wordpress_data:
